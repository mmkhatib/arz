<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Arz · Cedar Redesign</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    /* ── Cedar palette · DARK (default) ────────────────────────── */
    --bg:           oklch(.165 .012 150);
    --surface:      oklch(.205 .013 152);
    --surface-hi:   oklch(.235 .014 152);
    --s2:           oklch(.225 .013 152);
    --s3:           oklch(.265 .014 152);

    --text:         oklch(.96 .013 95);
    --text2:        oklch(.82 .015 95);
    --text3:        oklch(.66 .015 95);
    --muted:        oklch(.50 .013 95);

    --border:       oklch(.30 .013 150);
    --border2:      oklch(.38 .013 150);
    --hairline:     oklch(.255 .013 150);

    /* Cedar greens — warm, slightly mediterranean */
    --cedar:        oklch(.55 .14 150);
    --cedar-2:      oklch(.66 .14 150);
    --cedar-glow:   oklch(.78 .15 148);
    --cedar-dim:    oklch(.27 .05 150);
    --cedar-line:   oklch(.36 .07 150);

    /* Earth tones */
    --pine:         oklch(.50 .09 165);
    --pine-2:       oklch(.66 .12 165);
    --pine-dim:     oklch(.26 .04 165);

    --stone:        oklch(.66 .03 240);
    --stone-dim:    oklch(.26 .015 240);

    --dawn:         oklch(.74 .12 70);  /* warm amber */
    --dawn-dim:     oklch(.27 .05 70);

    --ember:        oklch(.66 .16 35);  /* alert red-orange */
    --ember-dim:    oklch(.27 .07 35);

    /* User bubble */
    --user-bg:      oklch(.27 .025 50);
    --user-bd:      oklch(.36 .03 50);

    /* Type stack */
    --fd: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
    --fn: 'Outfit', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
    --fm: 'JetBrains Mono', 'SF Mono', Menlo, monospace;

    --shadow-1: 0 4px 16px rgba(0,0,0,.3);
    --shadow-2: 0 16px 48px rgba(0,0,0,.5);
  }

  /* ── Cedar palette · LIGHT ───────────────────────────────────── */
  [data-theme="light"] {
    --bg:           oklch(.985 .006 95);
    --surface:      oklch(.998 .003 95);
    --surface-hi:   oklch(.97 .006 95);
    --s2:           oklch(.95 .008 95);
    --s3:           oklch(.92 .01 95);

    --text:         oklch(.20 .015 150);
    --text2:        oklch(.32 .015 150);
    --text3:        oklch(.45 .015 150);
    --muted:        oklch(.58 .013 150);

    --border:       oklch(.88 .01 150);
    --border2:      oklch(.78 .013 150);
    --hairline:     oklch(.93 .008 150);

    --cedar:        oklch(.45 .13 150);
    --cedar-2:      oklch(.40 .13 150);
    --cedar-glow:   oklch(.50 .15 150);
    --cedar-dim:    oklch(.94 .03 150);
    --cedar-line:   oklch(.83 .06 150);

    --pine:         oklch(.42 .09 165);
    --pine-2:       oklch(.36 .10 165);
    --pine-dim:     oklch(.93 .03 165);

    --stone:        oklch(.50 .03 240);
    --stone-dim:    oklch(.93 .015 240);

    --dawn:         oklch(.55 .14 60);
    --dawn-dim:     oklch(.96 .04 70);

    --ember:        oklch(.52 .17 30);
    --ember-dim:    oklch(.95 .05 35);

    --user-bg:      oklch(.96 .015 50);
    --user-bd:      oklch(.86 .025 50);

    --shadow-1: 0 2px 10px rgba(20,30,20,.06);
    --shadow-2: 0 16px 40px rgba(20,30,20,.12);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background: var(--bg); color: var(--text); font-family: var(--fn); font-size: 14px; -webkit-font-smoothing: antialiased; }
  body { overflow: hidden; }
  button { font-family: inherit; }
  ::selection { background: var(--cedar); color: #fff; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border2); background-clip: padding-box; border: 2px solid transparent; }

  /* Animations */
  @keyframes fadeUp { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:none; } }
  .fade-up { animation: fadeUp .25s ease-out; }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes bounce { 0%,80%,100% { transform: scale(.5); opacity:.4; } 40% { transform: scale(1); opacity:1; } }

  /* Scrim */
  .scrim { position: fixed; inset: 0; background: oklch(.1 .01 150 / .56); backdrop-filter: blur(6px); z-index: 1000; }

  textarea, input { font-family: var(--fn); }
  em { font-family: var(--fd); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="redesign/foundation.jsx"></script>
<script type="text/babel" src="redesign/tweaks-panel.jsx"></script>
<script type="text/babel" src="redesign/shell.jsx"></script>
<script type="text/babel" src="redesign/pages.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "density": "default",
  "memoryVariant": "rings",
  "scheduleVariant": "sun",
  "analyticsVariant": "mountain",
  "navCollapsed": false,
  "topo": true
}/*EDITMODE-END*/;

function App() {
  const [page, setPage] = useState(() => {
    return new URLSearchParams(location.search).get('p') || 'overview';
  });
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);
  const [collapsed, setCollapsed] = useState(t.navCollapsed);
  const [cmdOpen, setCmdOpen] = useState(false);

  // theme application
  useEffect(() => {
    document.documentElement.dataset.theme = t.theme;
  }, [t.theme]);

  // url sync
  useEffect(() => {
    const url = new URL(location.href); url.searchParams.set('p', page);
    history.replaceState(null, '', url);
  }, [page]);

  // ⌘K
  useEffect(() => {
    const onKey = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setCmdOpen(o => !o); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return (
    <div style={{ display:'flex', height:'100vh', width:'100%', background:'var(--bg)', color:'var(--text)' }}>
      <Sidebar
        active={page}
        onSelect={setPage}
        collapsed={collapsed}
        onToggle={() => setCollapsed(c => !c)}
        onCmdK={() => setCmdOpen(true)}
      />
      <main style={{ flex:1, display:'flex', flexDirection:'column', minWidth:0, position:'relative', overflow:'hidden' }}>
        <TopBar theme={t.theme} onTheme={v => setT('theme', v)} onCmdK={() => setCmdOpen(true)} page={page}/>
        <PageRouter page={page} tweaks={t} go={setPage}/>
      </main>
      <CommandPalette open={cmdOpen} onClose={() => setCmdOpen(false)} onNavigate={setPage}/>

      <TweaksPanel title="Tweaks" defaultPosition={{ right: 18, bottom: 18 }}>
        <TweakSection title="Appearance">
          <TweakRadio label="Theme" value={t.theme} onChange={v => setT('theme', v)}
            options={[{value:'dark',label:'Dark'},{value:'light',label:'Light'}]}/>
          <TweakRadio label="Density" value={t.density} onChange={v => setT('density', v)}
            options={[{value:'compact',label:'Compact'},{value:'default',label:'Default'},{value:'airy',label:'Airy'}]}/>
          <TweakToggle label="Topographic motifs" value={t.topo} onChange={v => setT('topo', v)}/>
        </TweakSection>
        <TweakSection title="Page variants">
          <TweakRadio label="Memory" value={t.memoryVariant} onChange={v => setT('memoryVariant', v)}
            options={[{value:'rings',label:'Rings'},{value:'list',label:'List'},{value:'forest',label:'Forest'}]}/>
          <TweakRadio label="Schedule" value={t.scheduleVariant} onChange={v => setT('scheduleVariant', v)}
            options={[{value:'sun',label:'Dial'},{value:'tape',label:'Tape'},{value:'list',label:'List'}]}/>
          <TweakRadio label="Analytics" value={t.analyticsVariant} onChange={v => setT('analyticsVariant', v)}
            options={[{value:'mountain',label:'Mtns'},{value:'grid',label:'Grid'},{value:'breakdown',label:'Table'}]}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

window.__renderApp = () => {
  try { ReactDOM.createRoot(document.getElementById('root')).render(<App/>); }
  catch(e) { console.error('render failed', e); document.getElementById('root').textContent = 'Error: '+e.message; }
};
// Defer until babel finishes processing all sibling scripts
setTimeout(window.__renderApp, 0);
</script>

</body>
</html>
