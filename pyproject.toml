[project]
name = "arz"
version = "0.3.2"
description = "Personal AI agent runtime — your cedar in the cloud."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mostafa Elkhatib" }]
keywords = ["ai", "agent", "assistant", "slack", "telegram", "whatsapp", "claude"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core runtime
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "typer>=0.12",
    "structlog>=24.4",
    "httpx>=0.27",
    # Persistence
    "sqlite-vec>=0.1.6",
    # Scheduling
    "apscheduler>=3.10",
    # Messaging surfaces
    "slack-bolt>=1.21",        # Slack (Socket Mode + Block Kit)
    "aiogram>=3.13",           # Telegram (async-native)
    # WhatsApp uses the Meta Cloud API via httpx (no dedicated SDK required)
    # Config writing
    "tomli-w>=1.0",
    # LLM providers
    "anthropic>=0.40",         # Direct Anthropic SDK provider
    # SSE streaming
    "sse-starlette>=2.1",
    "python-multipart>=0.0.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]

[project.scripts]
arz = "arz.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arz"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Curated rule set — keep the bug-finders, drop the style-noise.
#  E   — pycodestyle errors (selectively; full block has too many style rules)
#  F   — pyflakes (unused imports/vars, undefined names — must keep)
#  I   — import sorting
#  UP  — pyupgrade (deprecated stdlib aliases)
select = ["F", "I", "UP"]
ignore = [
    "S101",       # asserts in tests are fine
    "UP041",      # asyncio.TimeoutError alias is intentional for clarity
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "F841", "F401"]
"src/arz/static/**" = ["ALL"]

[tool.mypy]
python_version = "3.12"
# Strict mode would require annotating ~250 sites of long-lived code
# that's been validated by tests + manual use; not worth the churn.
# Keep the genuinely useful checks (undefined names, missing imports,
# obvious type errors) and skip the rest.
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
warn_unreachable = false
show_error_codes = true
pretty = true
# Don't fail on imported-but-untyped third-party code.
follow_imports = "silent"
# Don't require annotations on every function — pragmatic balance.
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
