[project]
name = "arz"
version = "0.1.0"
description = "Personal AI agent runtime — your cedar in the cloud."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mostafa Elkhatib" }]
keywords = ["ai", "agent", "assistant", "slack", "telegram", "whatsapp", "claude"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core runtime
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "typer>=0.12",
    "structlog>=24.4",
    "httpx>=0.27",

    # Persistence
    "sqlite-vec>=0.1.6",

    # Scheduling
    "apscheduler>=3.10",

    # Messaging surfaces
    "slack-bolt>=1.21",        # Slack (Socket Mode + Block Kit)
    "aiogram>=3.13",           # Telegram (async-native)
    # WhatsApp uses the Meta Cloud API via httpx (no dedicated SDK required)

    # LLM providers
    "anthropic>=0.40",         # Direct Anthropic SDK provider
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]

[project.scripts]
arz = "arz.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arz"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "SIM"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
