name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      # mypy disabled in CI — codebase wasn't typed strictly from the
      # start and the cost of fixing 250+ existing sites isn't worth it.
      # Re-enable once the typing baseline is cleaned up.

      - name: Test
        run: uv run pytest -v
